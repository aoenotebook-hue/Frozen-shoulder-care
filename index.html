<!-- Patient data must only ever leave this page towards the clinic's own sheet.
     connect-src names that single destination, so even if something managed to
     inject a script here it could not post an HN or a score anywhere else.
     'unsafe-inline' is unavoidable while the markup uses onclick handlers. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'">
<style>
  :root{
    --navy:#1F3864; --navy-2:#2b4a80; --teal:#2E7D6E; --teal-2:#3f9a89;
    --care:#2C5F8A; --bg:#F3F5F8; --card:#FFFFFF; --text:#232323; --muted:#6B7280;
    --border:#E6E9EF; --warn-bg:#FDF3E3; --warn-text:#7A4E00; --warn-border:#E8B860;
    --danger:#B3261E; --danger-bg:#FDECEC; --danger-dark:#7A1D17;
    --ok-bg:#EAF4EE; --ok-border:#8FC9A8; --ok-text:#1d6b3f;
    --radius:18px; --radius-sm:12px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:#DCE1E8;font-family:var(--font);color:var(--text);}
  body{display:flex;justify-content:center;min-height:100vh;}
  /* overflow-x must be clip, not hidden: hidden makes this a scrolling box,
     which silently stops the sticky header from sticking to the viewport. */
  #app-shell{width:100%;max-width:480px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow-x:clip;box-shadow:0 0 40px rgba(0,0,0,0.15);}

  header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-name{font-weight:700;font-size:13.5px;line-height:1.28;max-width:210px;}
  /* The HN sits inside the sticky header so it stays on screen while the
     patient scrolls, and so it is the one thing a nurse can read at a glance. */
  .brand-hn{font-size:11.5px;font-weight:600;letter-spacing:0.02em;
    color:rgba(255,255,255,0.82);line-height:1.3;margin-top:2px;}
  .brand-hn:empty{display:none;}
  /* Not sticky: it would otherwise slide under the header, which sits at the
     same offset with a higher stacking order, and disappear on the first scroll. */
  .idbar{display:flex;gap:8px;align-items:center;
    padding:9px 16px;background:var(--phase-soft,#EAF0F6);border-bottom:1px solid var(--border);}
  .idbar:not(:has(.id-chip:not(:empty))){display:none;}
  .id-chip{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .id-chip.hn{background:#fff;color:var(--navy);border:1px solid var(--border);flex-shrink:0;}
  .id-chip.phase{background:var(--phase,#2E7D6E);color:#fff;min-width:0;}
  .id-chip:empty{display:none;}
  .lang-toggle{display:flex;background:rgba(255,255,255,0.15);border-radius:999px;padding:3px;flex-shrink:0;}
  .lang-toggle button{border:none;background:transparent;color:#fff;opacity:.7;font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer;font-family:var(--font);}
  .lang-toggle button.active{background:#fff;color:var(--navy);opacity:1;}
  .lang-toggle.onboard-lang{background:#EEF1F5;margin:0 auto 18px;width:max-content;}
  .lang-toggle.onboard-lang button{color:var(--navy);opacity:.55;}
  .lang-toggle.onboard-lang button.active{background:var(--navy);color:#fff;opacity:1;}

  main{flex:1;overflow-y:auto;padding:16px 16px 100px;}
  .view{display:none;animation:fadeIn .25s ease;}
  .view.active{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,30,50,0.06);}
  .card h2,.privacy-card h2{margin:0 0 4px;font-size:15px;color:var(--navy);}
  .muted{color:var(--muted);font-size:13.5px;}

  .ring-wrap{display:flex;flex-direction:column;align-items:center;padding:22px 18px 6px;}
  .ring-svg{width:180px;height:180px;}
  .ring-bg{fill:none;stroke:#E9EDF3;stroke-width:12;}
  .ring-fg{fill:none;stroke:var(--teal);stroke-width:12;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .6s ease;}
  .ring-center{margin-top:-122px;text-align:center;pointer-events:none;}
  .ring-day{font-size:32px;font-weight:800;color:var(--navy);line-height:1;}
  .ring-day small{font-size:15px;color:var(--muted);font-weight:700;}
  .ring-daylabel{font-size:11px;color:var(--muted);margin-top:3px;padding:0 26px;line-height:1.35;}
  .ring-grade{font-size:11px;font-weight:800;margin-top:4px;letter-spacing:.03em;text-transform:uppercase;}
  .ring-phase-chip{margin-top:14px;background:var(--teal);color:#fff;font-size:13px;font-weight:700;padding:7px 16px;border-radius:999px;text-align:center;}
  .ring-phase-desc{font-size:13px;color:var(--muted);text-align:center;margin-top:8px;padding:0 12px;line-height:1.5;}
  .edit-date{border:none;background:none;color:var(--care);font-size:12px;font-weight:600;margin-top:10px;cursor:pointer;text-decoration:underline;font-family:var(--font);}
  .goal-item{display:flex;gap:9px;font-size:14px;color:#262626;line-height:1.55;margin-bottom:8px;align-items:flex-start;}
  .goal-num{width:20px;height:20px;border-radius:50%;background:var(--teal);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}

  .card .primary-btn{margin-top:14px;}

  /* UCLA option lists */
  .ucla-block{margin-bottom:22px;}
  .ucla-q{font-size:15px;font-weight:700;margin-bottom:3px;}
  .ucla-sub{font-size:13px;color:var(--muted);line-height:1.45;margin-bottom:10px;}
  .ucla-opts{display:flex;flex-direction:column;gap:7px;}
  .ucla-opt{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--border);background:#fff;border-radius:var(--radius-sm);padding:14px 13px;font-size:14px;line-height:1.45;font-family:var(--font);color:var(--text);text-align:left;cursor:pointer;transition:.15s;width:100%;}
  .ucla-opt:hover{border-color:#C6CDD8;}
  .ucla-opt.selected{border-color:var(--teal);border-width:2px;background:var(--ok-bg);font-weight:600;}
  .ucla-opt.locked{cursor:default;opacity:.5;}
  .ucla-opt.locked.selected{opacity:1;}
  .ucla-pts{flex-shrink:0;min-width:30px;height:24px;border-radius:7px;background:#EEF1F5;color:var(--muted);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .ucla-opt.selected .ucla-pts{background:var(--teal);color:#fff;}


  .home-footer{text-align:center;padding:18px 12px 6px;}
  .surgeon-credit{font-size:12.5px;color:var(--muted);margin-bottom:10px;}
  .surgeon-credit span#surgeon-name{color:var(--navy);font-weight:700;}
  .reset-link{background:none;border:none;color:#B0B4BC;font-size:11.5px;text-decoration:underline;cursor:pointer;padding:6px;font-family:var(--font);}

  .stepper{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 2px;}
  .step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;}
  .step .dot{width:26px;height:26px;border-radius:50%;background:#E9EDF3;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;z-index:2;}
  .step.done .dot{background:var(--teal);color:#fff;}
  .step.current .dot{background:var(--navy);color:#fff;box-shadow:0 0 0 4px rgba(31,56,100,0.15);}
  .step .lbl{font-size:10px;color:var(--muted);margin-top:6px;text-align:center;line-height:1.3;}
  .step::after{content:"";position:absolute;top:13px;left:50%;width:100%;height:2px;background:#E9EDF3;z-index:1;}
  .step:last-child::after{display:none;}
  .step.done::after{background:var(--teal);}

  .phase-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
  .phase-tab{flex-shrink:0;padding:8px 14px;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;font-family:var(--font);}
  .phase-tab.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .phase-tab.is-current{border-color:var(--teal);border-width:2px;}
  .phase-tab-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-left:6px;vertical-align:middle;}
  .phase-tab.active .phase-tab-dot{background:#fff;}
  .progress-bar-track{height:8px;border-radius:999px;background:#E9EDF3;overflow:hidden;margin-bottom:14px;}
  .progress-bar-fill{height:100%;background:var(--teal);border-radius:999px;transition:width .3s ease;}
  .progress-label{font-size:12px;color:var(--muted);margin-bottom:16px;}

  .ex-row{display:flex;gap:12px;background:var(--card);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(20,30,50,0.05);align-items:flex-start;}
  .ex-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:2px;transition:.15s;}
  .ex-check.checked{background:var(--teal);border-color:var(--teal);}
  .ex-check:focus-visible{outline:2px solid var(--care);outline-offset:2px;}
  .ex-check svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;opacity:0;transition:.15s;}
  .ex-check.checked svg{opacity:1;}
  .ex-icon{width:46px;height:46px;border-radius:12px;background:#EAF0F6;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ex-icon svg{width:28px;height:28px;stroke:var(--care);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .ex-body{flex:1;min-width:0;}
  .ex-name{font-weight:700;font-size:14.5px;margin-bottom:2px;}
  .ex-name.checked-text{text-decoration:line-through;color:var(--muted);}
  .ex-desc{font-size:13.5px;color:var(--muted);line-height:1.45;}
  .ex-dose{font-size:12.5px;color:var(--teal);font-weight:700;margin-top:4px;}
  .ex-cue{font-size:13px;color:var(--care);line-height:1.45;margin-top:5px;font-style:italic;}
  .ex-phase-def{background:#EAF0F6;color:var(--care);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.5;}
  .ex-phase-def strong{display:block;margin-bottom:3px;font-size:13.5px;}
  .ex-caution{display:flex;gap:8px;background:var(--warn-bg);color:var(--warn-text);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.5;font-weight:600;}

  /* video slots */

  .zone-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);}
  .zone-row:last-child{border-bottom:none;}
  .zone-chip{width:52px;flex-shrink:0;border-radius:7px;text-align:center;font-size:10.5px;font-weight:800;padding:4px 0;text-transform:uppercase;letter-spacing:.03em;}
  .zone-chip.g{background:var(--ok-bg);color:var(--ok-text);}
  .zone-chip.y{background:var(--warn-bg);color:var(--warn-text);}
  .zone-chip.r{background:var(--danger-bg);color:var(--danger-dark);}
  .zone-text{font-size:13px;line-height:1.5;color:#3a3a3a;}
  .zone-text b{color:var(--text);}
  .zone-text-g{color:var(--ok-text);} .zone-text-g b{color:inherit;}
  .zone-text-y{color:var(--warn-text);} .zone-text-y b{color:inherit;}
  .zone-text-r{color:var(--danger-dark);} .zone-text-r b{color:inherit;}

  /* arc dial (measurement input) */
  .arc-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .arc-cell{text-align:center;padding:6px 2px 10px;}
  .arc-cell svg{width:100%;max-width:130px;touch-action:none;}
  .arc-track{fill:none;stroke:#E9EDF3;stroke-width:9;stroke-linecap:round;}
  .arc-now{fill:none;stroke:var(--teal);stroke-width:9;stroke-linecap:round;}
  .arc-name{font-size:11.5px;font-weight:700;color:var(--navy);margin-top:2px;}
  .arc-val{font-size:12.5px;color:var(--text);font-weight:700;margin-top:2px;}
  .arc-pts{font-size:10.5px;color:var(--teal);font-weight:700;margin-top:2px;}

  /* parameter charts */
  .chart-card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,30,50,0.06);}
  .chart-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:2px;}
  .chart-title{font-size:13.5px;font-weight:700;color:var(--navy);}
  .chart-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .chart-now{font-size:24px;font-weight:800;color:var(--navy);line-height:1;white-space:nowrap;}
  .chart-now small{font-size:12px;color:var(--muted);font-weight:700;}
  .chart-delta{font-size:11.5px;font-weight:700;margin-top:3px;text-align:right;}
  .chart-delta.up{color:var(--ok-text);} .chart-delta.down{color:var(--danger);} .chart-delta.flat{color:var(--muted);}
  .chart-svg{width:100%;height:80px;display:block;margin-top:10px;}
  .chart-empty{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:8px;}

  .sleep-card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,30,50,0.06);}
  .sleep-head{display:flex;gap:14px;}
  .sleep-icon{width:52px;height:52px;border-radius:14px;background:#EAF0F6;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:24px;}
  .sleep-card.avoid .sleep-icon{background:var(--danger-bg);}
  .sleep-title{font-weight:700;font-size:14px;margin-bottom:3px;}
  .sleep-desc{font-size:13.5px;color:var(--muted);line-height:1.5;}

  .sos-banner{background:linear-gradient(135deg,var(--danger),#8f241d);color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .sos-banner h2{margin:0 0 6px;font-size:16px;color:#fff;}
  .sos-banner p{margin:0;font-size:13px;opacity:.9;line-height:1.5;}
  .info-note{background:#EAF0F6;color:var(--care);border-radius:var(--radius-sm);padding:13px 14px;margin-bottom:18px;font-size:13px;line-height:1.55;}
  .flag-section-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--danger-dark);margin:4px 0 10px;}
  .flag-item{display:flex;gap:10px;background:var(--danger-bg);border-radius:var(--radius-sm);padding:13px 14px;margin-bottom:9px;align-items:flex-start;}
  .flag-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);margin-top:6px;flex-shrink:0;}
  .flag-text{font-size:14px;color:var(--danger-dark);line-height:1.45;}
  .call-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--danger);color:#fff;border:none;border-radius:999px;padding:16px;font-size:15px;font-weight:700;margin:16px 0 8px;cursor:pointer;text-decoration:none;}
  .call-btn svg{width:18px;height:18px;fill:#fff;}
  .app-disclaimer{font-size:11px;color:var(--muted);text-align:center;line-height:1.55;margin-top:16px;padding:0 4px;}

  nav.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--border);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30;}
  .tab-btn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 1px;cursor:pointer;color:var(--muted);font-family:var(--font);min-width:0;}
  .tab-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;}
  .tab-btn span{font-size:9.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .tab-btn.active{color:var(--navy);}
  .tab-btn.sos{color:var(--danger);}
  .tab-btn.sos.active{color:var(--danger-dark);}
  .tab-btn.sos svg{stroke:var(--danger);}

  #onboard{position:fixed;inset:0;background:rgba(15,25,45,0.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
  #onboard.hidden{display:none;}
  .onboard-card{background:#fff;border-radius:22px;padding:24px 22px;max-width:400px;width:100%;max-height:90vh;overflow-y:auto;}
  .onboard-card h1{font-size:19px;color:var(--navy);margin:0 0 6px;}
  .onboard-card p.lead{font-size:13.5px;color:var(--muted);margin:0 0 20px;line-height:1.5;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:6px;}
  .field input,.field select{width:100%;padding:12px;border-radius:11px;border:1.5px solid var(--border);font-size:14px;font-family:var(--font);background:#FAFBFC;color:var(--text);}
  .field .hint{font-size:11px;color:var(--muted);margin-top:5px;}
  .field-row{display:flex;gap:10px;}
  .field-row > div{flex:1;}
  .primary-btn{width:100%;background:var(--teal);color:#fff;border:none;border-radius:999px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;font-family:var(--font);}
  .primary-btn.secondary{background:#fff;color:var(--navy);border:1.5px solid var(--border);}
  .primary-btn:disabled{opacity:.45;cursor:not-allowed;}
  .skip-link{display:block;text-align:center;font-size:12.5px;color:var(--muted);margin-top:14px;background:none;border:none;text-decoration:underline;cursor:pointer;width:100%;font-family:var(--font);}
  .consent-block{background:#F5F7FA;border-radius:14px;padding:14px 16px;margin-top:4px;}
  .consent-title{font-size:13px;font-weight:800;color:var(--navy);margin-bottom:6px;}
  .consent-text{font-size:12px;color:#444;line-height:1.55;margin:0 0 10px;}
  .consent-checkbox-row{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:var(--text);line-height:1.4;cursor:pointer;}
  .consent-checkbox-row input{width:17px;height:17px;flex-shrink:0;margin-top:1px;accent-color:var(--teal);}
  .checkin-validation{font-size:12.5px;font-weight:700;color:var(--danger);line-height:1.4;}
  .checkin-validation:empty{display:none;}
  .checkin-validation:not(:empty){margin-top:9px;}

  #measure-modal{position:fixed;inset:0;background:rgba(15,25,45,0.55);z-index:120;display:flex;align-items:center;justify-content:center;padding:16px;}
  #measure-modal.hidden{display:none;}
  .measure-card{background:#fff;border-radius:22px;padding:22px 20px;max-width:420px;width:100%;max-height:92vh;overflow-y:auto;}
  .measure-card h1{font-size:18px;color:var(--navy);margin:0 0 4px;}
  .measure-steps{display:flex;gap:5px;margin:14px 0 18px;}
  .measure-steps i{flex:1;height:4px;border-radius:2px;background:#E9EDF3;}
  .measure-steps i.on{background:var(--teal);}

  #addhome-modal{position:fixed;inset:0;background:rgba(15,25,45,0.55);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;}
  #addhome-modal.hidden{display:none;}
  .addhome-icon{width:64px;height:64px;margin:0 auto 10px;display:block;border-radius:16px;}
  .addhome-steps-text{font-size:13.5px;color:var(--text);background:#F5F7FA;border-radius:12px;padding:14px;line-height:1.5;text-align:center;margin:4px 0 14px;}

  .ring-dur-unit{font-size:14px;color:var(--muted);font-weight:700;}
  .ring-onset{font-size:10.5px;color:var(--muted);margin-top:5px;}
  .ucla-score-card{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border-radius:var(--radius);padding:20px 18px;margin-bottom:14px;}
  .ucla-score-card h2{color:#fff;margin:0 0 2px;font-size:14px;opacity:.85;}
  .ucla-score-row{display:flex;align-items:flex-end;gap:12px;margin-top:8px;}
  .ucla-score-big{font-size:46px;font-weight:800;line-height:1;letter-spacing:-.02em;}
  .ucla-score-big small{font-size:17px;opacity:.65;font-weight:700;}
  .ucla-score-grade{margin-left:auto;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.16);}
  .ucla-bars{margin-top:16px;}
  .ucla-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .ucla-bar-name{font-size:11.5px;width:88px;flex-shrink:0;opacity:.8;}
  .ucla-bar-track{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;}
  .ucla-bar-fill{height:100%;border-radius:3px;background:#7FE3C4;}
  .ucla-bar-val{font-size:11.5px;font-weight:700;width:38px;text-align:right;flex-shrink:0;}
  .ucla-score-foot{font-size:11px;opacity:.7;line-height:1.5;margin-top:12px;}

  .res-group{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:4px 0 10px;}
  .res-group:not(:first-child){margin-top:22px;}
  .res-card{display:flex;gap:13px;align-items:flex-start;background:var(--card);border-radius:var(--radius);padding:15px;margin-bottom:11px;box-shadow:0 1px 3px rgba(20,30,50,0.06);text-decoration:none;color:inherit;transition:.15s;}
  .res-card:hover{box-shadow:0 2px 10px rgba(20,30,50,0.11);}
  .res-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#EAF0F6;}
  .res-icon svg{width:22px;height:22px;stroke:var(--care);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .res-card.video .res-icon{background:#FDECEC;}
  .res-card.video .res-icon svg{stroke:var(--danger);}
  .res-body{flex:1;min-width:0;}
  .res-title{font-weight:700;font-size:14.5px;line-height:1.35;margin-bottom:3px;}
  .res-desc{font-size:13px;color:var(--muted);line-height:1.45;}
  .res-meta{display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:wrap;}
  .res-src{font-size:10.5px;font-weight:700;color:var(--care);background:#EAF0F6;border-radius:5px;padding:3px 7px;}
  .res-lang{font-size:10.5px;font-weight:700;color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:2px 6px;}
  .res-arrow{flex-shrink:0;align-self:center;}
  .res-arrow svg{width:17px;height:17px;stroke:#C6CDD8;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .res-note{background:#EAF0F6;color:var(--care);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:18px;font-size:12.5px;line-height:1.55;}

  /* weekly assessment reminder */
  .weekly{border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;border-left:5px solid;}
  .weekly.due{background:var(--warn-bg);border-color:var(--warn-border);}
  .weekly.done{background:var(--ok-bg);border-color:var(--ok-border);}
  .weekly-kicker{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;opacity:.75;margin-bottom:5px;}
  .weekly-title{font-size:15.5px;font-weight:800;margin-bottom:5px;}
  .weekly-body{font-size:13px;line-height:1.55;}
  .weekly.due .weekly-kicker,.weekly.due .weekly-title,.weekly.due .weekly-body{color:var(--warn-text);}
  .weekly.done .weekly-kicker,.weekly.done .weekly-title,.weekly.done .weekly-body{color:var(--ok-text);}
  .weekly .primary-btn{margin-top:12px;}
  .weekly.done .primary-btn{background:#fff;color:var(--ok-text);border:1.5px solid var(--ok-border);}

  /* general-guidance note on Home */
  .scope-note{display:flex;gap:11px;align-items:flex-start;background:#EAF0F6;color:var(--care);border-radius:var(--radius);padding:15px 16px;margin-bottom:14px;font-size:12.5px;line-height:1.6;}
  .scope-icon{font-size:16px;flex-shrink:0;line-height:1.3;}

  /* media (image and/or video) attached to an exercise or sleep item */
  .media{margin-top:11px;}
  .media img{width:100%;border-radius:10px;display:block;background:var(--bg);}
  .media video{width:100%;border-radius:10px;background:#000;display:block;}
  /* The thumbnail is the whole tap target, with the play badge sitting over
     the still. Without a still it falls back to a plain 16:9 panel. */
  .media-thumb{display:block;position:relative;width:100%;padding:0;border:none;
    border-radius:10px;overflow:hidden;background:var(--bg);cursor:pointer;line-height:0;}
  .media-thumb.no-still{aspect-ratio:16/9;background:var(--phase-soft,#EAF0F6);}
  /* A near-solid white disc with a dark glyph and a drop shadow — the badge
     has to stay legible over whatever photo gets uploaded behind it, light
     or dark, and the shadow carries it on the pale video-only panel too. */
  .media-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,0.95);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 14px rgba(0,0,0,0.45);pointer-events:none;}
  .media-play svg{width:23px;height:23px;fill:var(--navy);margin-left:3px;}
  .media-thumb:active .media-play{background:#fff;}
  @media (prefers-reduced-motion:no-preference){
    .media-play{transition:background 0.15s ease;}
  }

  /* chart axis + plain-language read-out */
  .chart-axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:5px;}
  .chart-read{font-size:12.5px;line-height:1.5;margin-top:9px;padding-top:9px;border-top:1px solid var(--border);color:var(--muted);}
  .chart-read b{color:var(--text);}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
  .stage-row{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--border);}
  .stage-row:last-child{border-bottom:none;}
  .stage-row.now{background:var(--ok-bg);border-radius:10px;padding:13px 12px;border-bottom:none;margin:2px 0;}
  .stage-num{width:24px;height:24px;border-radius:50%;background:#E9EDF3;color:var(--muted);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
  .stage-row.now .stage-num{background:var(--teal);color:#fff;}
  .stage-body{flex:1;min-width:0;}
  .stage-title{font-size:14px;font-weight:700;color:var(--navy);}
  .stage-you{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--teal);border-radius:5px;padding:2px 6px;vertical-align:middle;}
  .stage-months{font-size:11.5px;color:var(--muted);margin:2px 0 6px;}
  .stage-line{font-size:13px;line-height:1.5;color:#3a3a3a;margin-bottom:4px;}
  .stage-line b{color:var(--navy);}
  /* Home takes its accent from the stage the patient is in:
     warming irritation -> peak inflammation -> cold and stuck -> recovery. */
  #view-home .ring-fg{stroke:var(--phase);}
  #view-home .ring-phase-chip{background:var(--phase);}
  #view-home .goal-num{background:var(--phase);}
  #view-home .step.current .dot{background:var(--phase);box-shadow:0 0 0 4px var(--phase-ring);}
  #view-home .step.done .dot{background:var(--phase);}
  #view-home .step.done::after{background:var(--phase);}
  #view-home .scope-note{background:var(--phase-soft);color:var(--phase-ink);}
  #view-home .weekly.done{background:var(--phase-soft);border-color:var(--phase);}
  #view-home .weekly.done .weekly-kicker,
  #view-home .weekly.done .weekly-title,
  #view-home .weekly.done .weekly-body{color:var(--phase-ink);}
  #view-home .weekly.done .primary-btn{color:var(--phase-ink);border-color:var(--phase);}
  #view-home .card h2{color:var(--phase-ink);}
  .privacy-card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;
    box-shadow:0 1px 3px rgba(20,30,50,0.06);}
  .privacy-row{display:flex;gap:11px;align-items:flex-start;font-size:13px;line-height:1.55;
    color:#3a3a3a;padding:8px 0;}
  .privacy-row .pi{flex-shrink:0;font-size:14px;line-height:1.4;}
  .hidden{display:none !important;}
  ::-webkit-scrollbar{width:0;height:0;}

  /* Content-protection deterrents (see script comment for what this can and
     can't actually stop). Selection/callout are re-enabled on real form
     fields so typing the HN and answering assessments still works normally. */
  html, body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none;}
  input, textarea, select{-webkit-user-select:text;-moz-user-select:text;user-select:text;-webkit-touch-callout:default;}
  img, video{-webkit-user-select:none;user-select:none;}
  #privacy-cover{position:fixed;inset:0;z-index:9999;background:var(--navy);}
</style>
</head>
<body>

<div id="privacy-cover" class="hidden"></div>
<div id="app-shell">
  <header>
    <div class="brand">
      <div>
        <div class="brand-name" data-t="appName">Frozen shoulder recovery</div>
        <div class="brand-hn" id="header-hn"></div>
      </div>
    </div>
    <div class="lang-toggle">
      <button id="btn-lang-en" onclick="setLang('en')">EN</button>
      <button id="btn-lang-th" onclick="setLang('th')">TH</button>
    </div>
  </header>
  <div class="idbar" id="idbar">
    <span class="id-chip phase" id="header-phase"></span>
  </div>

  <main>
    <!-- HOME -->
    <section class="view active" id="view-home">
      <div class="card" style="padding-bottom:16px;">
        <div class="ring-wrap">
          <svg class="ring-svg" viewBox="0 0 160 160">
            <circle class="ring-bg" cx="80" cy="80" r="70"></circle>
            <circle class="ring-fg" id="ring-fg" cx="80" cy="80" r="70" stroke-dasharray="440"></circle>
          </svg>
          <div class="ring-center">
            <div class="ring-day" id="ring-day">—</div>
            <div class="ring-daylabel" id="ring-daylabel"></div>
            <div class="ring-grade" id="ring-grade"></div>
          </div>
          <div class="ring-phase-chip" id="ring-phase-chip">—</div>
          <div class="ring-phase-desc" id="ring-phase-desc"></div>
        </div>
        <hr style="border:0;border-top:1px solid var(--border);margin:16px 0 14px;">
        <h2 data-t="roadmapTitle">Your Recovery Roadmap</h2>
        <div class="stepper" id="home-stepper" style="margin-top:14px;"></div>
        <p class="muted" data-t="roadmapNote" style="margin-top:14px;line-height:1.55;"></p>
      </div>

      <div class="card">
        <h2 id="goals-title">Your goals right now</h2>
        <p class="muted" id="goals-sub" style="margin-bottom:12px;line-height:1.5;"></p>
        <div id="goals-list"></div>
      </div>

      <div class="card">
        <h2 data-t="todayTitle">Today's Reminders</h2>
        <p class="muted" id="today-reminders" style="line-height:1.6;font-size:13.5px;color:#3a3a3a;"></p>
      </div>

      <div class="scope-note">
        <div class="scope-icon">ℹ️</div>
        <div data-t="scopeNote"></div>
      </div>

      <div id="weekly-reminder"></div>

      <div class="home-footer">
        <div class="surgeon-credit"><span data-t="surgeonLabel">Your doctor</span>: <span id="surgeon-name"></span></div>
        <button class="reset-link" onclick="handleResetApp()" data-t="resetBtn">Reset App Data</button>
      </div>
    </section>

    <!-- EXERCISES -->
    <section class="view" id="view-exercises">
      <div id="ex-phase-def"></div>
      <div id="ex-progress-wrap">
        <div class="progress-bar-track"><div class="progress-bar-fill" id="ex-progress-fill" style="width:0%"></div></div>
        <div class="progress-label" id="ex-progress-label"></div>
      </div>
      <div id="ex-list"></div>
      <div class="card">
        <h2 data-t="zoneTitle">How hard should it feel?</h2>
        <div id="zone-list" style="margin-top:8px;"></div>
      </div>
    </section>

    <!-- PROGRESS -->
    <section class="view" id="view-progress"><div id="progress-body"></div></section>

    <!-- SLEEP -->
    <section class="view" id="view-sleep">
      <div class="card" style="margin-bottom:16px;">
        <h2 data-t="sleepTitle">Sleeping With a Frozen Shoulder</h2>
        <p class="muted" data-t="sleepIntro"></p>
      </div>
      <div id="sleep-list"></div>
    </section>

    <!-- SELF CARE -->
    <section class="view" id="view-selfcare">
      <div class="card" style="margin-bottom:16px;">
        <h2 data-t="selfcareTitle">Everyday Self-Care</h2>
        <p class="muted" data-t="selfcareIntro"></p>
      </div>
      <div id="selfcare-list"></div>
    </section>

    <!-- RESOURCES -->
    <section class="view" id="view-resources">
      <div class="card" style="margin-bottom:16px;">
        <h2 data-t="resTitle">Learn more</h2>
        <p class="muted" data-t="resIntro"></p>
      </div>
      <div class="card" style="margin-bottom:18px;">
        <h2 data-t="stagesCardTitle">The four stages</h2>
        <p class="muted" data-t="stagesCardIntro" style="line-height:1.55;"></p>
        <div id="stages-list" style="margin-top:14px;"></div>
        <div class="res-note" data-t="phaseTimingNote" style="margin:14px 0 0;"></div>
        <p class="muted" data-t="stagesCardOutcome" style="line-height:1.6;margin-top:14px;"></p>
      </div>
      <div class="res-note" data-t="resNote"></div>
      <div id="res-list"></div>
      <div class="card" style="margin-top:22px;">
        <h2 data-t="escalateTitle">What your doctor might add</h2>
        <p class="muted" data-t="escalateIntro" style="line-height:1.55;"></p>
        <div id="escalate-list" style="margin-top:12px;"></div>
        <p class="muted" data-t="escalateNoDose" style="margin-top:12px;font-size:11.5px;"></p>
      </div>
      <div class="privacy-card" style="margin-top:22px;">
        <h2 data-t="privacyTitle">Your privacy</h2>
        <p class="muted" data-t="privacyIntro" style="margin-bottom:12px;"></p>
        <div id="privacy-list"></div>
      </div>
    </section>

    <!-- ALERT -->
    <section class="view" id="view-sos">
      <div class="sos-banner">
        <h2 data-t="sosTitle">When to Get Help</h2>
        <p data-t="sosSub"></p>
      </div>
      <div class="info-note" data-t="sosInfoNote"></div>
      <div id="flag-list"></div>
      <a class="call-btn" id="call-btn" href="#">
        <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z"/></svg>
        <span id="call-btn-text"></span>
      </a>
      <p class="app-disclaimer" data-t="appDisclaimer"></p>
    </section>
  </main>

</div>

<!-- Onboarding -->
<div id="onboard" class="hidden">
  <div class="onboard-card">
    <div class="lang-toggle onboard-lang">
      <button id="ob-lang-en" onclick="setLang('en')">English</button>
      <button id="ob-lang-th" onclick="setLang('th')">ไทย</button>
    </div>
    <h1 data-t="onboardTitle"></h1>
    <p class="lead" data-t="onboardLead"></p>

      <label data-t="onboardOnsetLabel"></label>

        <div><select id="input-onset-month"></select></div>
        <div><select id="input-onset-year"></select></div>

  </div>
</div>

<script>
/* =====================================================================
   CONTENT-PROTECTION DETERRENTS. A web page cannot actually refuse to be
   copied or screen-captured: rendering it means handing the device real
   pixels and, for typed fields, real text, and every OS provides a
   screenshot/recording path and a camera outside this page's reach. What
   follows only raises friction for the casual case (right-click save,
   drag-out, long-press copy, the OS app-switcher thumbnail) — it is not
   a security boundary and must not be represented as one.
   ===================================================================== */
document.addEventListener('contextmenu', e => {
  if(!e.target.closest('input, textarea, select')) e.preventDefault();
});
document.addEventListener('dragstart', e => {
  if(e.target.closest('img, video')) e.preventDefault();
});
document.addEventListener('copy', e => {
  if(!e.target.closest('input, textarea, select')) e.preventDefault();
});
document.addEventListener('visibilitychange', () => {
  document.getElementById('privacy-cover').classList.toggle('hidden', !document.hidden);
});

/* =====================================================================

function icon(name){
  return '<svg viewBox="0 0 24 24">' + (ICONS[name]||ICONS.pendulum) + '</svg>';

/* =====================================================================
   UCLA SHOULDER RATING SCALE (Amstutz 1981) — 35 points total.
   Pain 10 + Function 10 + Active forward flexion 5 + Strength 5 + Satisfaction 5.
   Forward flexion points are derived from the degrees the patient dials in,
   so the arc control feeds the score directly.
   ===================================================================== */
const FLEXION_BANDS = [
  {min:150, pts:5}, {min:120, pts:4}, {min:90, pts:3},
  {min:45,  pts:2}, {min:30,  pts:1}, {min:0,  pts:0}
];
function flexionPoints(deg){
  for(const b of FLEXION_BANDS){ if(deg >= b.min) return b.pts; }
  return 0;
}
const UCLA_MAX = 35;
function uclaTotal(u, flexionDeg){
  return u.pain + u.func + flexionPoints(flexionDeg) + u.strength + u.satisfaction;
}
function uclaGrade(total){
  if(total >= 34) return 'excellent';
  if(total >= 29) return 'good';
  return 'poor';

/* =====================================================================
   MEDIA DISCOVERY
   Upload a file into media/ under the name the topic expects and it
   appears. There is no list to maintain: the page asks the server
   whether each file is there and remembers the answer.

   A static page cannot read its own folder, so each candidate name gets
   one HEAD request — a few hundred bytes of headers, not the file. The
   answers are cached for the session, and the affected tabs re-render
   once the replies arrive, so a topic never flashes an empty box while
   a probe is in flight. Files are looked up under media/.

   media/README.md lists the filename every topic expects.
   ===================================================================== */
const IMAGE_DIR = "media/";
const VIDEO_DIR = "media/";

const MEDIA_FOUND = new Map();    // filename -> true | false, once known
const MEDIA_ASKED = new Set();    // filename -> a probe is already in flight
let mediaRepaintTimer = null;

const hasImage = f => !!f && MEDIA_FOUND.get(f) === true;
const hasVideo = f => !!f && MEDIA_FOUND.get(f) === true;

/* HEAD is enough on any ordinary static host. A host that refuses it
   (405) still answers a one-byte ranged GET, so fall back to that
   rather than leaving the media invisible. */
async function mediaProbe(url){
  try{
    const head = await fetch(url, {method:'HEAD'});
    if(head.ok) return true;
    if(head.status !== 405) return false;
  }catch(e){ return false; }
  try{
    const ranged = await fetch(url, {headers:{Range:'bytes=0-0'}});
    return ranged.ok;
  }catch(e){ return false; }
}

function discoverMedia(file, dir){
  if(!file || MEDIA_FOUND.has(file) || MEDIA_ASKED.has(file)) return;
  MEDIA_ASKED.add(file);
  mediaProbe(dir + file).then(found=>{
    MEDIA_ASKED.delete(file);
    MEDIA_FOUND.set(file, found);
    if(found) scheduleMediaRepaint();
  });
}

/* One repaint for a burst of replies, rather than one per file. Only the
   tabs that carry media need it, and re-rendering them cannot start a
   loop: by then every filename has a cached answer. */
function scheduleMediaRepaint(){
  if(mediaRepaintTimer) return;
  mediaRepaintTimer = setTimeout(()=>{
    mediaRepaintTimer = null;
    renderExerciseList(); renderSleep(); renderSelfCare();
  }, 80);
}
/* For values dropped into an HTML attribute, including the inline onclick
   that carries a filename through to the player. */
const escapeAttr = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
  .replace(/</g,'&lt;').replace(/>/g,'&gt;');

function todayISO(){ return new Date().toISOString().slice(0,10); }
function checkDayRollover(){
  if(STATE.logDate !== todayISO()){ STATE.logDate = todayISO(); STATE.doneIds = []; return true; }
  return false;
}
/* An HN is a hospital number, so letters, digits and dashes are all it can be.
   Stripping everything else keeps stray input out of the record and, because
   the HN is written into a spreadsheet cell downstream, also drops the leading
   =, +, - and @ that a spreadsheet would otherwise read as a formula. */
function sanitiseHN(value){
  return String(value || '')
    .replace(/[^A-Za-z0-9-]/g, '')
    .replace(/^[-]+/, '')
    .slice(0, 20);
}

/* Saved state is read back into a live object, so a half-written or edited
   entry could otherwise throw on the first render and leave the patient with a
   blank screen and no way to reach the reset button. Anything of the wrong
   shape is dropped and the app starts clean instead. */
function sanitiseState(saved){
  if(!saved || typeof saved !== 'object' || Array.isArray(saved)) return {};
  const out = {};
  if(saved.lang === 'en' || saved.lang === 'th') out.lang = saved.lang;
  out.hn = sanitiseHN(saved.hn);
  const mo = parseInt(saved.onsetMonth, 10), yr = parseInt(saved.onsetYear, 10);
  out.onsetMonth = (mo >= 1 && mo <= 12) ? mo : null;
  out.onsetYear  = (yr >= 1900 && yr <= 2200) ? yr : null;
  out.consentGiven = !!saved.consentGiven;
  out.homeScreenPromptShown = !!saved.homeScreenPromptShown;
  out.logDate = typeof saved.logDate === 'string' ? saved.logDate : null;
  out.doneIds = Array.isArray(saved.doneIds) ? saved.doneIds : [];
  out.adherence = (saved.adherence && typeof saved.adherence === 'object'
    && !Array.isArray(saved.adherence)) ? saved.adherence : {};
  out.measures = Array.isArray(saved.measures) ? saved.measures.filter(m =>
    m && typeof m === 'object'
    && m.ucla && typeof m.ucla === 'object'
    && m.rom  && typeof m.rom  === 'object'
    && typeof m.rom.flexion === 'number'
    && typeof m.ucla.pain === 'number' && typeof m.ucla.func === 'number'
    && typeof m.ucla.strength === 'number' && typeof m.ucla.satisfaction === 'number'
  ) : [];
  return out;
}

async function loadState(){
  try{
    const raw = localStorage.getItem('frozenshoulder-app-state');
    if(raw) STATE = Object.assign(STATE, sanitiseState(JSON.parse(raw)));

  checkDayRollover();
}

/* ================== SYMPTOM-DRIVEN STAGE LOGIC ==================
   Stage comes from the UCLA domains, never from a calendar. Daily
   check-ins refresh pain and function, so the stage responds between
   full assessments. Flexion/strength/satisfaction come from the last
   full assessment because they need the arc and a strength grade. */
function latestMeasure(){ return STATE.measures.length ? STATE.measures[STATE.measures.length-1] : null; }
function baselineMeasure(){ return STATE.measures.length ? STATE.measures[0] : null; }

/* The UCLA scale is completed once a week, not daily. Everything the app
   shows comes from the most recent weekly assessment. */
function effectiveUcla(){
  const m = latestMeasure();
  if(!m) return null;
  return { u:m.ucla, flexionDeg:m.rom.flexion };
}

const DAY_MS = 86400000;
function daysSinceLastMeasure(){
  const m = latestMeasure();
  if(!m) return null;
  const then = new Date(m.date + 'T00:00:00');
  const now = new Date(todayISO() + 'T00:00:00');
  return Math.round((now - then) / DAY_MS);
}
/* The UCLA scale is completed once a month. Frozen shoulder changes over
   weeks to months, so a monthly cadence matches the pace of the condition
   and keeps the burden on the patient low. */
const ASSESS_INTERVAL_DAYS = 30;
function assessmentDue(){
  const d = daysSinceLastMeasure();
  return d === null ? true : d >= ASSESS_INTERVAL_DAYS;
}
/* Whole months *past the due date*, not months since the last assessment.
   An assessment recorded 60 days ago became due at day 30, so it is one
   month overdue, not two. */
function monthsOverdue(){
  const d = daysSinceLastMeasure();
  if(d === null) return 0;
  return Math.max(0, Math.floor(d / ASSESS_INTERVAL_DAYS) - 1);
}
function formatDate(iso){
  const c = CONTENT[STATE.lang];
  const dt = new Date(iso + 'T00:00:00');
  return dt.getDate() + ' ' + c.monthNamesShort[dt.getMonth()];
}
function nextDueDate(){
  const m = latestMeasure();
  if(!m) return '';
  const dt = new Date(new Date(m.date + 'T00:00:00').getTime() + ASSESS_INTERVAL_DAYS*DAY_MS);
  return formatDate(dt.toISOString().slice(0,10));
}
function currentTotal(){
  const e = effectiveUcla();
  return e ? uclaTotal(e.u, e.flexionDeg) : null;
}
/* Direction of travel across the last two assessments. One UCLA pain point
   is treated as roughly equivalent to five degrees of elevation. */
function romTrend(){
  const ms = STATE.measures;
  if(ms.length < 2) return 0;
  const a = ms[ms.length-2], b = ms[ms.length-1];
  const d = (b.rom.flexion - a.rom.flexion) + (b.ucla.pain - a.ucla.pain) * 5;
  if(d > 8) return 1;
  if(d < -8) return -1;
  return 0;
}

/* Pre-freezing sits at the front of the course only. Once a shoulder has
   been through severe pain or lost elevation below 90 degrees, it cannot be
   pre-freezing again, however good it later looks. */
function everPastPreFreezing(){
  return STATE.measures.some(m => m.ucla.pain <= 4 || flexionPoints(m.rom.flexion) <= 2);
}

/* Stage is read primarily from time since symptom onset, following the
   typical clinical course: pre-freezing months 1-3, freezing months 4-9,
   frozen months 10-14, thawing month 15 on. When no onset date is on file
   the stage falls back to an estimate from the patient's own symptoms. */
function currentStageIndex(){
  const mo = monthsSinceOnset();
  if(mo !== null){
    if(mo <= 2)  return 0;   // Pre-freezing: months 1-3
    if(mo <= 8)  return 1;   // Freezing: months 4-9
    if(mo <= 13) return 2;   // Frozen: months 10-14
    return 3;                // Thawing: month 15 on
  }

  const e = effectiveUcla();
  if(!e) return 0;
  const pain = e.u.pain, func = e.u.func, fx = flexionPoints(e.flexionDeg);

  if(pain <= 4) return 1;   // Freezing: pain at rest or constant
  if(fx <= 2)   return 2;   // Frozen: cannot raise the arm past 90 degrees

  const nearNormal = fx >= 4 && func >= 8;
  const total = uclaTotal(e.u, e.flexionDeg);
  // Pre-freezing describes a shoulder that is sore and becoming touchy — not
  // one that is essentially well. An excellent score rules it out.
  if(nearNormal && total < 34 && !everPastPreFreezing() && romTrend() <= 0) return 0;
  return 3;                 // Thawing
}

/** Recovered: full forward elevation and pain that is absent or mild
    (UCLA pain domain 8 or 10 — "occasional and slight" or "none"),
    regardless of what stage the calendar would otherwise suggest. */
function isRecovered(){
  const e = effectiveUcla();
  return e !== null && e.flexionDeg >= 150 && e.u.pain >= 8;
}

/* ============================= ARC DIAL ============================= */
function arcPath(cx, cy, r, frac){
  if(frac <= 0.001) return "";
  const a = frac * Math.PI;
  return `M ${cx.toFixed(2)} ${(cy+r).toFixed(2)} A ${r} ${r} 0 0 0 ${(cx + r*Math.sin(a)).toFixed(2)} ${(cy + r*Math.cos(a)).toFixed(2)}`;
}
function arcSvg(frac, key, max){
  const cx=60, cy=60, r=44, a=frac*Math.PI;
  const hx = cx + r*Math.sin(a), hy = cy + r*Math.cos(a);
  return `<svg viewBox="0 0 120 120" data-arc="${key}" data-max="${max}">
    <path class="arc-track" d="${arcPath(cx,cy,r,1)}"/>
    <path class="arc-now" d="${arcPath(cx,cy,r,frac)}"/>
    <line x1="${cx}" y1="${cy}" x2="${hx.toFixed(2)}" y2="${hy.toFixed(2)}" stroke="#2E7D6E" stroke-width="1.5" opacity="0.3"/>
    <circle cx="${cx}" cy="${cy}" r="2.5" fill="#B7BEC9"/>
    <circle cx="${hx.toFixed(2)}" cy="${hy.toFixed(2)}" r="8" fill="#2E7D6E" stroke="#fff" stroke-width="2.5"/>
  </svg>`;
}
function moveValueLabel(m, v){ return m.key === 'ir' ? t('irLandmarks')[v] : (v + m.unit); }

/* ============================= MEDIA SLOTS =============================
   A topic only takes up room once its file is actually on the server.
   Nothing there means nothing rendered — no placeholder, no reserved
   space — so a half-filled library reads as a clean list rather than a
   page of empty boxes.

   With a video, the slot is a thumbnail carrying a play badge: the still if
   one was uploaded, otherwise a plain panel. Tapping it swaps in the player.
   An image on its own is just the image, with no badge to press. */
const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';

function mediaSlot(imgFile, vidFile){
  // Asking costs nothing once an answer is cached, so every render is also
  // the point at which a newly uploaded file gets noticed.
  discoverMedia(imgFile, IMAGE_DIR);
  discoverMedia(vidFile, VIDEO_DIR);

  const img = hasImage(imgFile), vid = hasVideo(vidFile);
  if(!img && !vid) return '';

  const still = img ? `<img src="${IMAGE_DIR}${imgFile}" alt="" loading="lazy" draggable="false" oncontextmenu="return false">` : '';
  if(!vid) return `<div class="media">${still}</div>`;

  return `<div class="media">
    <button class="media-thumb ${img ? '' : 'no-still'}" type="button"
            aria-label="${escapeAttr(t('mediaWatch'))}" onclick="playVideo(this,'${escapeAttr(vidFile)}')">
      ${still}
      <span class="media-play">${ICON_PLAY}</span>
    </button>
  </div>`;
}

function playVideo(btn, file){
  const wrap = btn.closest('.media');
  wrap.innerHTML = `<video controls playsinline preload="metadata" src="${VIDEO_DIR}${file}"
    controlsList="nodownload noremoteplayback" disablePictureInPicture
    oncontextmenu="return false"></video>`;
  wrap.querySelector('video').play().catch(()=>{});
}

/** Whole months elapsed since the recorded month/year of symptom onset. */
function monthsSinceOnset(){
  if(!STATE.onsetMonth || !STATE.onsetYear) return null;
  const now = new Date();
  const m = (now.getFullYear() - (+STATE.onsetYear)) * 12 + (now.getMonth() + 1 - (+STATE.onsetMonth));
  return m < 0 ? null : m;
}
function onsetLabel(){
  if(!STATE.onsetMonth || !STATE.onsetYear) return '';
  return t('onsetPrefix') + t('monthNames')[(+STATE.onsetMonth) - 1] + ' ' + STATE.onsetYear;
}

/* Stage palette. Deliberately narrative: stage 1 warming irritation,
   stage 2 peak inflammation, stage 3 cold and stuck, stage 4 recovery. */
const PHASE_THEME = [
  { main:'#C08A2E', soft:'#FBF3E2', ink:'#7A5410', ring:'rgba(192,138,46,0.18)' },
  { main:'#C25A3E', soft:'#FBEDE9', ink:'#7E3626', ring:'rgba(194,90,62,0.18)'  },
  { main:'#3D6E96', soft:'#EAF1F7', ink:'#254764', ring:'rgba(61,110,150,0.18)' },
  { main:'#2E7D6E', soft:'#E9F4F1', ink:'#1D5349', ring:'rgba(46,125,110,0.18)' }
];
function applyPhaseTheme(stage){
  const p = PHASE_THEME[stage] || PHASE_THEME[3];
  const r = document.documentElement.style;
  r.setProperty('--phase', p.main);
  r.setProperty('--phase-soft', p.soft);
  r.setProperty('--phase-ink', p.ink);
  r.setProperty('--phase-ring', p.ring);
}

/* ============================= HOME ============================= */
function renderHome(){
  const c = CONTENT[STATE.lang];
  const e = effectiveUcla();
  const stage = currentStageIndex();
  const CIRC = 440;

  const dayEl = document.getElementById('ring-day');
  const labelEl = document.getElementById('ring-daylabel');
  const gradeEl = document.getElementById('ring-grade');
  const chipEl = document.getElementById('ring-phase-chip');
  const descEl = document.getElementById('ring-phase-desc');
  const ringFg = document.getElementById('ring-fg');

  // Home shows how long this has been going on and which stage they are in.
  // The UCLA score lives on the Progress tab.
  const months = monthsSinceOnset();
  if(months === null){
    dayEl.innerHTML = "—";
    labelEl.textContent = c.durationUnknown;
  } else {
    dayEl.innerHTML = String(months);
    labelEl.textContent = months === 1 ? c.durationLabelOne : c.durationLabel;
  }
  gradeEl.textContent = onsetLabel();
  gradeEl.style.color = 'var(--muted)';
  gradeEl.style.textTransform = 'none';
  gradeEl.style.letterSpacing = '0';
  gradeEl.style.fontWeight = '600';

  if(!e){
    chipEl.textContent = c.noBaselineChip;
    descEl.textContent = c.noBaselineDesc;
    ringFg.style.strokeDashoffset = CIRC;
  } else if(isRecovered()){
    chipEl.textContent = c.recoveredChip;
    descEl.textContent = c.recoveredDesc;
    ringFg.style.strokeDashoffset = 0;
  } else {
    chipEl.textContent = c.phaseNames[stage] + " · " + c.phaseTitles[stage];
    // The months are shown as context — currentStageIndex() already used them
    // as the primary gate whenever an onset date is on file.
    descEl.innerHTML = `<b>${c.phaseHeadline[stage]}</b><br>${c.phaseDesc[stage]}`
      + `<br><span style="font-size:11.5px;color:var(--dim,#8a8a8a);">${c.phaseMonths[stage]}</span>`;
    ringFg.style.strokeDashoffset = CIRC * (1 - (stage + 1) / 4);
  }

  document.getElementById('goals-title').textContent = c.goalsTitleByPhase[stage];
  document.getElementById('goals-sub').textContent = c.goalsSub;
  document.getElementById('goals-list').innerHTML = c.goalsByPhase[stage]
    .map((g,i)=>`<div class="goal-item"><div class="goal-num">${i+1}</div><div>${g}</div></div>`).join('');

  document.getElementById('home-stepper').innerHTML = c.phaseShort.map((label,i)=>{
    let cls = 'step';
    if(e){ if(i < stage) cls += ' done'; else if(i === stage) cls += ' current'; }
    return `<div class="${cls}"><div class="dot">${i+1}</div><div class="lbl">${label}</div></div>`;
  }).join('');

  document.getElementById('today-reminders').innerHTML =
    c.todayReminders[stage].map(r=>`• ${r}`).join('<br><br>');
  document.getElementById('surgeon-name').textContent = c.surgeonName;
  renderIdBar();

  renderWeeklyReminder();
}

/* The one nudge in the app: the weekly UCLA assessment. Green once it is
   done, amber once seven days have passed. */
/* HN and current stage stay visible at the top of every tab. */
function renderIdBar(){
  const c = CONTENT[STATE.lang];
  const stage = currentStageIndex();
  applyPhaseTheme(stage);
  // Most patients type the number as it is printed on the card, "HN-004512",
  // so prefixing it again would read "HN: HN-004512".
  document.getElementById('header-hn').textContent =
    !STATE.hn ? '' : (/^HN/i.test(STATE.hn) ? STATE.hn : c.hnPrefix + STATE.hn);
  const ph = document.getElementById('header-phase');
  if(!latestMeasure()){
    ph.textContent = c.noBaselineChip;
  } else if(isRecovered()){
    ph.textContent = c.recoveredChip;
  } else {
    ph.textContent = c.phaseNames[stage] + ' · ' + c.phaseTitles[stage];
  }
  // Older browsers without :has() would leave an empty coloured strip behind.
  document.getElementById('idbar').hidden = !ph.textContent;
}

function renderWeeklyReminder(){
  const c = CONTENT[STATE.lang];
  const wrap = document.getElementById('weekly-reminder');
  const m = latestMeasure();

  if(!m){
    wrap.innerHTML = `<div class="weekly due">
      <div class="weekly-kicker">${c.weeklyDueKicker}</div>
      <div class="weekly-title">${c.weeklyNoneTitle}</div>
      <div class="weekly-body">${c.weeklyNoneBody}</div>
      <button class="primary-btn" onclick="openMeasure()">${c.weeklyDueBtn}</button>
    </div>`;
    return;
  }
  if(assessmentDue()){
    const over = monthsOverdue();
    const overTpl = over === 1 ? c.weeklyOverdueTitleOne : c.weeklyOverdueTitle;
    const title = over >= 1 ? overTpl.replace('{n}', over) : c.weeklyDueTitle;
    const body  = over >= 1 ? c.weeklyOverdueBody : c.weeklyDueBody;
    wrap.innerHTML = `<div class="weekly due">
      <div class="weekly-kicker">${c.weeklyDueKicker}</div>
      <div class="weekly-title">${title}</div>
      <div class="weekly-body">${body}</div>
      <button class="primary-btn" onclick="openMeasure()">${c.weeklyDueBtn}</button>
    </div>`;
    return;
  }
  wrap.innerHTML = `<div class="weekly done">
    <div class="weekly-kicker">${c.weeklyDoneKicker}</div>
    <div class="weekly-title">${c.weeklyDoneTitle}</div>
    <div class="weekly-body">${c.weeklyDoneBody.replace('{d}', formatDate(m.date)).replace('{next}', nextDueDate())}</div>
    <button class="primary-btn" onclick="openMeasure()">${c.weeklyDoneBtn}</button>
  </div>`;
}

/* ===================== SHARED UCLA OPTION LIST ===================== */
function uclaOptionList(opts, selected, handler, locked){
  return `<div class="ucla-opts">` + opts.map(o=>
    `<button class="ucla-opt ${selected===o.v?'selected':''} ${locked?'locked':''}"
      ${locked?'':`onclick="${handler}(${o.v})"`}>
      <span class="ucla-pts">${o.v}</span><span>${o.t}</span></button>`
  ).join('') + `</div>`;
}

async function syncOne(bucket, key){
  const entry = STATE.measures[key];
  if(!entry || entry.synced) return;
  if(!SHEET_WEBHOOK_URL || SHEET_WEBHOOK_URL.indexOf("PASTE_YOUR") === 0) return;
  try{
    await fetch(SHEET_WEBHOOK_URL, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({token:APP_TOKEN, recordType:bucket}, entry))
    });
    entry.synced = true;   // optimistic: no-cors hides the real response
    saveState();
  }catch(err){ console.warn('Sync failed, will retry next app load:', err); }
}
async function trySyncPending(){
  for(let i=0;i<STATE.measures.length;i++){ if(!STATE.measures[i].synced) await syncOne('measures', i); }
}

/* ============================= EXERCISES =============================
   Group 0 gentle mobility · 1 stretches · 2 strengthening · 3 return to life.
   Pre-freezing and freezing share the gentle programme; what differs between
   them is dose and intent, which the stage text carries. */
const EXERCISE_GROUPS = [ [0], [0], [0,1], [1,2] ];
function exerciseGroupsFor(stage){
  if(stage !== 3) return EXERCISE_GROUPS[stage];
  // Late thawing: swap the gentle stretches for return-to-life work.
  const tot = currentTotal();
  return (tot !== null && tot >= 29) ? [2,3] : [1,2];
}

function renderExerciseList(){
  const c = CONTENT[STATE.lang];
  const i = currentStageIndex();
  document.getElementById('ex-phase-def').innerHTML =
    `<div class="ex-caution">⚠️ ${c.exCaution}</div>`;

  const list = exerciseGroupsFor(i).flatMap(src => c.exercises[src]);
  const doneSet = new Set(STATE.doneIds);
  const doneCount = list.filter(x=>doneSet.has(x.id)).length;

  document.getElementById('ex-progress-fill').style.width = (list.length ? (doneCount/list.length*100) : 0) + '%';
  document.getElementById('ex-progress-label').textContent = `${doneCount} / ${list.length}`;

  document.getElementById('ex-list').innerHTML = list.map(x=>{
    const done = doneSet.has(x.id);
    return `<div class="ex-row">
      <div class="ex-check ${done?'checked':''}" role="checkbox" tabindex="0"
        aria-checked="${done}" aria-label="${escapeAttr(x.name)}"
        onclick="toggleExercise('${x.id}')"
        onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();toggleExercise('${x.id}');}">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>
      </div>
      <div class="ex-icon">${icon(x.ic)}</div>
      <div class="ex-body">
        <div class="ex-name ${done?'checked-text':''}">${x.name}</div>
        <div class="ex-desc">${x.desc}</div>
        <div class="ex-dose">${x.dose}</div>
        ${x.cue ? `<div class="ex-cue">${x.cue}</div>` : ''}
        ${mediaSlot(x.img, x.vid)}
      </div>
    </div>`;
  }).join('');

  document.getElementById('zone-list').innerHTML = c.zones.map(z=>
    `<div class="zone-row"><div class="zone-text zone-text-${z[0]}">${z[2]}</div></div>`
  ).join('');
}
function toggleExercise(id){
  const s = new Set(STATE.doneIds);
  s.has(id) ? s.delete(id) : s.add(id);
  STATE.doneIds = [...s];
  recordAdherence();
  saveState(); renderExerciseList();
}

/* Daily exercise completion is kept on the device and summarised into the
   weekly assessment, so the patient never has to submit anything daily. */
function recordAdherence(){
  const c = CONTENT[STATE.lang];
  const stage = currentStageIndex();
  const list = exerciseGroupsFor(stage).flatMap(src => c.exercises[src]);
  const doneSet = new Set(STATE.doneIds);
  STATE.adherence[todayISO()] = {
    done: list.filter(x=>doneSet.has(x.id)).length,
    total: list.length
  };
  // keep the map small
  const keys = Object.keys(STATE.adherence).sort();
  while(keys.length > 90){ delete STATE.adherence[keys.shift()]; }
}
/** Days in the current assessment window with at least one exercise ticked. */
function adherenceSummary(){
  const now = new Date(todayISO() + 'T00:00:00').getTime();
  let daysActive = 0, doneSum = 0, totalSum = 0;
  for(const d in STATE.adherence){
    const age = (now - new Date(d + 'T00:00:00').getTime()) / DAY_MS;
    if(age >= 0 && age < ASSESS_INTERVAL_DAYS){
      const a = STATE.adherence[d];
      if(a.done > 0) daysActive++;
      doneSum += a.done; totalSum += a.total;
    }
  }
  return { daysActive, doneSum, totalSum };
}

/* ============================= PROGRESS CHARTS ============================= */
/* One chart per parameter. Higher is better for every series here, so a
   rising line always means improvement — including pain, because the UCLA
   pain domain scores 10 for no pain. */
function lineChart(vals, opts){
  const c = CONTENT[STATE.lang];
  if(!vals || vals.length < 2) return `<div class="chart-empty">${c.chartEmpty}</div>`;
  const w=320, h=80, pad=8;
  const lo = opts.min !== undefined ? opts.min : 0;
  const hi = opts.max !== undefined ? opts.max : Math.max.apply(null, vals);
  const span = (hi - lo) || 1;
  const pts = vals.map((v,i)=>[
    pad + (i/(vals.length-1))*(w-pad*2),
    pad + (1 - (Math.max(lo,Math.min(hi,v)) - lo)/span)*(h-pad*2)
  ]);
  const d = pts.map((p,i)=>`${i?'L':'M'} ${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const area = `${d} L ${pts[pts.length-1][0].toFixed(1)} ${h} L ${pts[0][0].toFixed(1)} ${h} Z`;
  const col = opts.color || '#2E7D6E';
  return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <line x1="0" y1="${h-1}" x2="${w}" y2="${h-1}" stroke="#E9EDF3" stroke-width="1"/>
    <path d="${area}" fill="${col}22"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===pts.length-1?4:3}" fill="${col}"/>`).join('')}
  </svg>`;
}

function chartCard(cfg){
  const c = CONTENT[STATE.lang];
  const vals = cfg.vals.filter(v=>v!==null && v!==undefined && !isNaN(v));
  const fmt = v => cfg.fmt ? cfg.fmt(v) : (v===null ? '—' : v);
  const now = vals.length ? vals[vals.length-1] : null;
  const first = vals.length ? vals[0] : null;

  let delta = '', dcls = 'flat', readout = '';
  if(vals.length >= 2){
    const d = Math.round((now - first) * 10) / 10;
    dcls = d > 0 ? 'up' : (d < 0 ? 'down' : 'flat');
    delta = `${d>0?'+':''}${d} ${c.deltaSince}`;
    // Plain-language line so the graph is readable without interpreting it.
    const tpl = d > 0 ? c.chartUp : (d < 0 ? c.chartDown : c.chartFlat);
    readout = `<div class="chart-read">${tpl
      .replace('{d}', Math.abs(d) + (cfg.suffix || ''))
      .replace('{a}', fmt(first) + (cfg.suffix || ''))
      .replace('{b}', fmt(now) + (cfg.suffix || ''))}</div>`;
  } else {
    readout = `<div class="chart-read">${c.chartNeedTwo}</div>`;
  }

  // date axis: first and latest assessment
  const axis = (cfg.dates && cfg.dates.length >= 2)
    ? `<div class="chart-axis"><span>${formatDate(cfg.dates[0])}</span><span>${formatDate(cfg.dates[cfg.dates.length-1])}</span></div>`
    : '';

  return `<div class="chart-card">
    <div class="chart-head">
      <div>
        <div class="chart-title">${cfg.title}</div>
        <div class="chart-sub">${cfg.sub}</div>
      </div>
      <div style="text-align:right;">
        <div class="chart-now">${fmt(now)}${cfg.suffix?`<small>${cfg.suffix}</small>`:''}</div>
        ${delta?`<div class="chart-delta ${dcls}">${delta}</div>`:''}
      </div>
    </div>
    ${lineChart(vals, cfg)}
    ${axis}
    ${readout}
  </div>`;
}

function renderProgress(){
  const c = CONTENT[STATE.lang];
  const wrap = document.getElementById('progress-body');
  const ms = STATE.measures;

  if(!ms.length){
    wrap.innerHTML = `<div class="card">
      <h2>${c.progNoData}</h2>
      <p class="muted" style="line-height:1.55;margin-top:6px;">${c.progNoDataBody}</p>
      <button class="primary-btn" onclick="openMeasure()">${c.progStartBtn}</button>
    </div>`;
    return;
  }

  const stage = currentStageIndex();
  const dates = ms.map(m=>m.date);
  const CH = c.charts;
  const chart = (cfg) => chartCard(Object.assign({ dates:dates }, cfg));

  // Headline UCLA score, with the five domains broken out beneath it.
  const e = effectiveUcla();
  let scoreCard = '';
  if(e){
    const total = uclaTotal(e.u, e.flexionDeg);
    const domains = [
      [c.uclaDomains[0], e.u.pain, 10],
      [c.uclaDomains[1], e.u.func, 10],
      [c.uclaDomains[2], flexionPoints(e.flexionDeg), 5],
      [c.uclaDomains[3], e.u.strength, 5],
      [c.uclaDomains[4], e.u.satisfaction, 5]
    ];
    scoreCard = `<div class="ucla-score-card">
      <h2>${c.uclaCardTitle}</h2>
      <div class="ucla-score-row">
        <div class="ucla-score-big">${total}<small> / ${UCLA_MAX}</small></div>
        <div class="ucla-score-grade">${c.gradeNames[uclaGrade(total)]}</div>
      </div>
      <div class="ucla-bars">${domains.map(([name,val,max])=>`
        <div class="ucla-bar-row">
          <div class="ucla-bar-name">${name}</div>
          <div class="ucla-bar-track"><div class="ucla-bar-fill" style="width:${(val/max*100).toFixed(0)}%"></div></div>
          <div class="ucla-bar-val">${val} / ${max}</div>
        </div>`).join('')}</div>
      <div class="ucla-score-foot">${c.uclaCardFoot}</div>
    </div>`;
  }

  wrap.innerHTML = `
    ${scoreCard}
    <div class="card">
      <h2>${c.phaseNames[stage]} · ${c.phaseTitles[stage]}</h2>
      <p class="muted" style="margin-top:6px;font-size:12px;">${c.progCount.replace('{n}', ms.length)}</p>
      <button class="primary-btn" onclick="openMeasure()">${c.remeasureBtn}</button>
    </div>
    ${chart({ ...CH.total, vals: ms.map(m=>uclaTotal(m.ucla, m.rom.flexion)), max:35, suffix:' / 35', color:'#1F3864' })}
    ${chart({ ...CH.pain, vals: ms.map(m=>m.ucla.pain), max:10, suffix:' / 10', color:'#E8B860' })}
    ${chart({ ...CH.func, vals: ms.map(m=>m.ucla.func), max:10, suffix:' / 10', color:'#2C5F8A' })}
    ${chart({ ...CH.flexdeg, vals: ms.map(m=>m.rom.flexion), max:180, suffix:'°', color:'#2E7D6E' })}
    ${chart({ ...CH.abduction, vals: ms.map(m=>m.rom.abduction), max:180, suffix:'°', color:'#2E7D6E' })}
    ${chart({ ...CH.er, vals: ms.map(m=>m.rom.er), max:90, suffix:'°', color:'#3f9a89' })}
    ${chart({ ...CH.ir, vals: ms.map(m=>m.rom.ir), max:8, color:'#3f9a89',
              fmt:v=> v===null?'—':t('irLandmarks')[v] })}
    ${chart({ ...CH.strength, vals: ms.map(m=>m.ucla.strength), max:5, suffix:' / 5', color:'#2C5F8A' })}
    <p class="app-disclaimer">${c.progFooter}</p>`;
}

      <div class="res-icon">${r.type==='video'?ICON_VIDEO:ICON_ARTICLE}</div>
      <div class="res-body">
        <div class="res-title">${r.title}</div>
        <div class="res-desc">${r.desc}</div>
        <div class="res-meta">

        <div class="stage-months">${c.phaseMonths[i]}</div>

        <div class="stage-line"><b>${c.phaseSymptomsLabel}:</b> ${c.phaseSymptoms[i]}</div>
      </div>
    </div>`).join('');

    c.escalate.map(e=>`<div class="goal-item"><div class="goal-num">•</div><div>${e}</div></div>`).join('');

  const videos = c.resources.filter(r=>r.type==='video');
  const articles = c.resources.filter(r=>r.type==='article');
  document.getElementById('res-list').innerHTML =
    (videos.length ? `<div class="res-group">${c.resGroupVideo}</div>` + videos.map(card).join('') : '') +

/* ============================= ASSESSMENT FLOW ============================= */
let measureStep = 0;
let draft = null;

/* Last month's range is a sensible place to leave the dials — the patient
   drags from where they were. Last month's answers are not: carrying them
   over pre-selects every option, which both leads the answer and lets the
   whole assessment be clicked through without reading a single question,
   filing a copy of last month as though it were new. They start empty, so
   the validation in measureNext() means something. */
function defaultDraft(){
  const prev = latestMeasure();
  const rom = prev ? JSON.parse(JSON.stringify(prev.rom))
                   : { flexion:95, abduction:80, er:20, ir:2 };
  return { ucla:{ pain:null, func:null, strength:null, satisfaction:null }, rom };
}
function openMeasure(){
  if(!STATE.consentGiven){ openOnboard(true); return; }
  draft = defaultDraft(); measureStep = 0;
  document.getElementById('measure-modal').classList.remove('hidden');
  renderMeasure();
}
function closeMeasure(){ document.getElementById('measure-modal').classList.add('hidden'); }
/* Nothing is written to STATE until the final step, so cancelling is safe.
   Only blocked before the very first assessment, which the app needs. */
function cancelMeasure(){
  if(!latestMeasure()) return;
  draft = null; measureStep = 0; closeMeasure();
}

function renderMeasure(){
  const c = CONTENT[STATE.lang];
  document.getElementById('measure-title').textContent = c.measureTitles[measureStep];
  document.getElementById('measure-lead').textContent = c.measureLeads[measureStep];
  document.querySelectorAll('.measure-steps i').forEach((el,i)=> el.classList.toggle('on', i<=measureStep));
  document.getElementById('measure-next').textContent = measureStep < 2 ? c.measureNext : c.measureFinish;
  const back = document.getElementById('measure-back');
  back.textContent = c.measureBack;
  back.classList.toggle('hidden', measureStep === 0);
  const cancel = document.getElementById('measure-cancel');
  cancel.textContent = c.measureCancel;
  cancel.classList.toggle('hidden', !latestMeasure());

  const body = document.getElementById('measure-body');

  if(measureStep === 0){
    body.innerHTML = `
      <div class="ucla-block">
        <div class="ucla-q">${c.uclaPainQ}</div><div class="ucla-sub">${c.uclaPainSub}</div>
        ${uclaOptionList(c.uclaPainOpts, draft.ucla.pain, 'setDraftUclaPain', false)}
      </div>
      <div class="ucla-block">
        <div class="ucla-q">${c.uclaFuncQ}</div><div class="ucla-sub">${c.uclaFuncSub}</div>
        ${uclaOptionList(c.uclaFuncOpts, draft.ucla.func, 'setDraftUclaFunc', false)}
      </div>`;
  }

  if(measureStep === 1){
    body.innerHTML = `
      <div class="ucla-block" style="margin-bottom:10px;">
        <div class="ucla-q">${c.uclaFlexQ}</div><div class="ucla-sub">${c.uclaFlexSub}</div>
      </div>
      <div class="arc-grid">` + c.moves.map(m=>{
        const v = draft.rom[m.key];
        return `<div class="arc-cell">
          ${arcSvg(v/m.max, m.key, m.max)}
          <div class="arc-name">${m.name}</div>
          <div class="arc-val">${moveValueLabel(m, v)}</div>
          <div class="arc-pts">${m.scored ? flexionPoints(v) + c.ptsSuffix : '&nbsp;'}</div>
        </div>`;
      }).join('') + `</div>`;
    bindArcDrag();
  }

  if(measureStep === 2){
    body.innerHTML = `
      <div class="ucla-block">
        <div class="ucla-q">${c.uclaStrengthQ}</div><div class="ucla-sub">${c.uclaStrengthSub}</div>
        ${uclaOptionList(c.uclaStrengthOpts, draft.ucla.strength, 'setDraftUclaStrength', false)}
      </div>
      <div class="ucla-block">
        <div class="ucla-q">${c.uclaSatQ}</div><div class="ucla-sub">${c.uclaSatSub}</div>
        ${uclaOptionList(c.uclaSatOpts, draft.ucla.satisfaction, 'setDraftUclaSat', false)}
      </div>`;
  }
}
function setDraftUclaPain(v){ draft.ucla.pain = v; renderMeasure(); }
function setDraftUclaFunc(v){ draft.ucla.func = v; renderMeasure(); }
function setDraftUclaStrength(v){ draft.ucla.strength = v; renderMeasure(); }
function setDraftUclaSat(v){ draft.ucla.satisfaction = v; renderMeasure(); }

function bindArcDrag(){
  const moves = CONTENT[STATE.lang].moves;
  document.querySelectorAll('#measure-body svg[data-arc]').forEach(svg=>{
    const key = svg.getAttribute('data-arc');
    const max = +svg.getAttribute('data-max');
    const move = moves.find(m=>m.key===key);
    const cell = svg.closest('.arc-cell');
    let dragging = false;

    // Repaint this arc in place — re-rendering the step would replace the
    // <svg> node mid-gesture and drop pointer capture after one move.
    const paint = (v)=>{
      const frac = v/max, a = frac*Math.PI;
      const hx = 60 + 44*Math.sin(a), hy = 60 + 44*Math.cos(a);
      svg.querySelector('.arc-now').setAttribute('d', arcPath(60,60,44,frac));
      const line = svg.querySelector('line');
      line.setAttribute('x2', hx.toFixed(2)); line.setAttribute('y2', hy.toFixed(2));
      const handle = svg.querySelectorAll('circle')[1];
      handle.setAttribute('cx', hx.toFixed(2)); handle.setAttribute('cy', hy.toFixed(2));
      cell.querySelector('.arc-val').textContent = moveValueLabel(move, v);
      if(move.scored) cell.querySelector('.arc-pts').textContent = flexionPoints(v) + t('ptsSuffix');
    };
    const update = (ev)=>{
      const rect = svg.getBoundingClientRect();
      const px = ((ev.clientX - rect.left)/rect.width)*120;
      const py = ((ev.clientY - rect.top)/rect.height)*120;
      let a = Math.atan2(px-60, py-60);
      if(a < 0) a = 0;
      const v = Math.round(Math.min(1, a/Math.PI)*max);
      if(v !== draft.rom[key]){ draft.rom[key] = v; paint(v); }
    };
    svg.addEventListener('pointerdown', e=>{
      dragging = true; e.preventDefault();
      try{ svg.setPointerCapture(e.pointerId); }catch(err){}
      update(e);
    });
    svg.addEventListener('pointermove', e=>{ if(dragging) update(e); });
    svg.addEventListener('pointerup', ()=>{ dragging = false; });
    svg.addEventListener('pointercancel', ()=>{ dragging = false; });
  });
}

async function measureNext(){
  const c = CONTENT[STATE.lang];
  if(measureStep === 0){
    if(draft.ucla.pain === null || draft.ucla.func === null){ alert(c.measureValidation); return; }
    measureStep = 1; renderMeasure(); return;
  }
  if(measureStep === 1){ measureStep = 2; renderMeasure(); return; }
  if(draft.ucla.strength === null || draft.ucla.satisfaction === null){ alert(c.measureValidation); return; }

  const entry = {
    recordedAt: new Date().toISOString(),
    date: todayISO(),
    hn: STATE.hn || "",
    ucla: draft.ucla,
    rom: draft.rom,
    flexionPts: flexionPoints(draft.rom.flexion),
    uclaTotal: uclaTotal(draft.ucla, draft.rom.flexion),
    onsetMonthYear: (STATE.onsetMonth && STATE.onsetYear) ? (STATE.onsetYear + "-" + String(STATE.onsetMonth).padStart(2,'0')) : "",
    monthsSinceOnset: monthsSinceOnset(),
    synced: false
  };
  // exercise adherence over the past week travels with the assessment
  const ad = adherenceSummary();
  entry.daysExercisedThisMonth = ad.daysActive;
  entry.exercisesDoneThisMonth = ad.doneSum;
  entry.exercisesPossibleThisMonth = ad.totalSum;
  entry.uclaGrade = uclaGrade(entry.uclaTotal);
  STATE.measures.push(entry);
  entry.stage = CONTENT.en.phaseNames[currentStageIndex()] + " - " + CONTENT.en.phaseTitles[currentStageIndex()];
  saveState(); closeMeasure(); renderAll();
  await syncOne('measures', STATE.measures.length - 1);
}
function measureBack(){ if(measureStep > 0){ measureStep--; renderMeasure(); } }

/* ============================= TABS / ONBOARD ============================= */
function switchTab(tab){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  if(tab === 'exercises'){ renderExerciseList(); }
  if(tab === 'progress') renderProgress();
  // The shell grows with its content, so <main> never overflows — the window is
  // the scroller. Reset both so a new tab always opens at the top.
  document.querySelector('main').scrollTop = 0;
  window.scrollTo(0, 0);
}

function buildOnsetSelects(){
  const c = CONTENT[STATE.lang];
  const mSel = document.getElementById('input-onset-month');
  const ySel = document.getElementById('input-onset-year');
  if(!mSel || !ySel) return;
  const keepM = STATE.onsetMonth || mSel.value;
  const keepY = STATE.onsetYear || ySel.value;
  mSel.innerHTML = `<option value="">${c.selectMonth}</option>` +
    c.monthNames.map((n,i)=>`<option value="${i+1}">${n}</option>`).join('');
  const thisYear = new Date().getFullYear();
  ySel.innerHTML = `<option value="">${c.selectYear}</option>` +
    Array.from({length:11},(_,i)=>thisYear-i).map(y=>`<option value="${y}">${y}</option>`).join('');
  if(keepM) mSel.value = keepM;
  if(keepY) ySel.value = keepY;
}

function openOnboard(prefill){
  buildOnsetSelects();
  if(prefill){
    document.getElementById('input-hn').value = STATE.hn || '';
    document.getElementById('input-consent').checked = !!STATE.consentGiven;
  }
  document.getElementById('onboard').classList.remove('hidden');
}
function saveOnboard(){
  const c = CONTENT[STATE.lang];
  if(!document.getElementById('input-consent').checked){
    document.getElementById('consent-validation').textContent = c.consentValidation; return;
  }
  STATE.onsetMonth = document.getElementById('input-onset-month').value || null;
  STATE.onsetYear  = document.getElementById('input-onset-year').value || null;
  STATE.hn = sanitiseHN(document.getElementById('input-hn').value);
  STATE.consentGiven = true;
  saveState();
  document.getElementById('onboard').classList.add('hidden');
  renderAll();
  const willPromptAddHome = !IS_STANDALONE && !STATE.homeScreenPromptShown;
  maybeShowAddHomePrompt();
  if(!willPromptAddHome && !latestMeasure()) openMeasure();
}

/* ============================= INIT ============================= */
function renderAll(){
  applyStaticI18n();
  renderHome();
  renderExerciseList();
  renderProgress();
  renderSleep();
  renderSelfCare();
  renderResources();
  renderSOS();
}
(async function init(){
  await loadState();
  buildOnsetSelects();
  renderAll();
  if(!STATE.consentGiven) openOnboard(true);
  else if(!latestMeasure()) openMeasure();
  else maybeShowAddHomePrompt();
  trySyncPending();
})();
</script>
